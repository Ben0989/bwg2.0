<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSPD BWG Manager</title></head><body><p style="font-family:system-ui;padding:20px">BWG Manager wird geladen …</p><script src="chunk0.js"></script><script src="chunk1.js"></script><script>(async()=>{try{const b64=(window.BWG_CHUNKS||[]).join("");const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream("gzip");const out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(out);document.close();}catch(e){document.body.innerHTML="<h2>BWG Manager konnte nicht geladen werden.</h2><pre>"+String(e)+"</pre>";}})();</script></body></html>
